name: NexusChat CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create environment file
        run: |
          echo "OPENROUTER_API_KEY=ci-placeholder-key" > .env
          echo "GEMINI_API_KEY=ci-placeholder-key" >> .env

      - name: Run API tests
        run: python -m pytest day12/test_api_ci.py -v --tb=short

      - name: Report success
        run: echo "All NexusChat CI tests passed."